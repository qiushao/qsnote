<article>
  <h1>{{title}}</h1>
  <div class="meta">{{>meta}} {{>categories}} {{>tags}}</div>
  {{#toc}}<details><summary>文章目录</summary><ol>{{{toc}}}</ol></details>{{/toc}}
  <div class="markdown-body">{{{body}}}</div>
  {{#hasNavigation}}<nav class="post-navigation">{{>navigation}}</nav>{{/hasNavigation}}
  {{{comments}}}
</article>
