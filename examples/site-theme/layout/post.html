<article>
  <h1>{{title}}</h1>
  <div class="meta">{{meta}} {{categories}} {{tags}}</div>
  {{#toc}}<details><summary>文章目录</summary>{{toc}}</details>{{/toc}}
  <div class="markdown-body">{{body}}</div>
  {{#navigation}}<nav class="post-navigation">{{navigation}}</nav>{{/navigation}}
  {{comments}}
</article>
