name: macos

on:
  push:
    branches: [master, main]
    tags: ['V*', 'v*']
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [master, main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.4.2'
          arch: clang_64
          modules: 'qt5compat qtwebengine qtwebchannel qtpositioning'

      - name: Build
        run: |
          version=1.0.0
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#[Vv]}"
          fi
          ./scripts/macos-build.sh "$version"

      - name: Install and test diagram dependencies
        run: |
          brew install plantuml graphviz
          brew tap-new qsnote/ci
          mkdir -p "$(brew --repository qsnote/ci)/Casks"
          cp Casks/qsnote.rb "$(brew --repository qsnote/ci)/Casks/"
          brew readall qsnote/ci
          cmake -S . -B build-macos -DQSNOTE_BUILD_TESTS=ON
          cmake --build build-macos --parallel --target qsnote_diagram_tests
          ctest --test-dir build-macos -R '^qsnote_diagram$' --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: qsnote-macos
          path: build-macos/*.dmg
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qsnote-macos
          path: packages
      - uses: softprops/action-gh-release@v3
        with:
          files: packages/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
