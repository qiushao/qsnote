name: windows-msvc2022

on:
  push:
    branches: [master, main]
    tags: ['V*', 'v*']
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [master, main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.4.2'
          arch: win64_msvc2019_64
          modules: 'qt5compat qtwebengine qtwebchannel qtpositioning'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup system Java for build and tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and package
        shell: pwsh
        run: |
          $version = '1.0.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^[Vv]', ''
          }
          ./scripts/windows-build.ps1 -Version $version

      - name: Test diagram runtime
        shell: pwsh
        run: |
          cmake -S . -B build-windows -DQSNOTE_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw 'Test configure failed' }
          cmake --build build-windows --config Release --parallel --target qsnote_diagram_tests
          if ($LASTEXITCODE -ne 0) { throw 'Test build failed' }
          windeployqt --release --compiler-runtime build-windows/diagram-tests/Release/qsnote_diagram_tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Test runtime deployment failed' }
          ctest --test-dir build-windows -C Release -R '^qsnote_diagram$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Diagram tests failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: qsnote-windows
          path: build-windows/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qsnote-windows
          path: packages
      - uses: softprops/action-gh-release@v3
        with:
          files: packages/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
