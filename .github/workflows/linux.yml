name: linux

on:
  push:
    branches: [master, main]
    tags: ['V*', 'v*']
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [master, main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential qt6-base-dev qt6-base-private-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools qt6-svg-dev qt6-5compat-dev qt6-webengine-dev qt6-webchannel-dev libgl1-mesa-dev clang-tidy dpkg-dev plantuml graphviz default-jre-headless

      - name: Build
        run: |
          version=1.0.0
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#[Vv]}"
          fi
          ./scripts/linux-build.sh "$version"

      - name: Verify DEB package
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for dependency in plantuml graphviz default-jre-headless; do
            dpkg-deb -f build/*.deb Depends | tr ',' '\n' | grep -Eq "^[[:space:]]*$dependency([[:space:]]|$)"
          done
          dpkg-deb -x build/*.deb build/package-check
          test -f build/package-check/usr/share/applications/qsnote.desktop
          test -f build/package-check/usr/share/icons/hicolor/128x128/apps/qsnote.png
          test -f build/package-check/usr/share/licenses/qsnote/vtextedit/COPYING.LESSER
          version="$(dpkg-deb -f build/*.deb Version)"
          test "$(env -u LD_LIBRARY_PATH ./build/package-check/usr/bin/qsnote --version)" = "qsnote $version"

      - name: Test diagram runtime
        run: |
          cmake -S . -B build -DQSNOTE_BUILD_TESTS=ON
          cmake --build build --parallel --target qsnote_diagram_tests
          ctest --test-dir build -R '^qsnote_diagram$' --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: qsnote-linux
          path: build/*.deb
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qsnote-linux
          path: packages
      - uses: softprops/action-gh-release@v3
        with:
          files: packages/*.deb
          fail_on_unmatched_files: true
          generate_release_notes: true
