<section class="vp-profile">{{#avatarImage}}<div class="profile-avatar">{{avatarImage}}</div>{{/avatarImage}}<div class="profile-info"><h3>{{author}}</h3><p>{{description}}</p>{{#city}}<div class="profile-location"><span class="vpi-location" aria-hidden="true"></span><p>{{city}}</p></div>{{/city}}</div>{{#githubSocial}}<div class="profile-social"><a class="vp-social-link" href="{{githubSocial}}" aria-label="GitHub">{{githubIcon}}</a></div>{{/githubSocial}}</section>
<nav class="vp-posts-nav" aria-label="博客索引">
<a class="nav-link" href="{{root}}tags/"><span class="vpi-tag icon-logo" aria-hidden="true"></span><span class="text">标签</span><span class="total">{{tagCount}}</span><span class="vpi-chevron-right icon" aria-hidden="true"></span></a>
<a class="nav-link" href="{{root}}categories/"><span class="vpi-category icon-logo" aria-hidden="true"></span><span class="text">分类</span><span class="total">{{categoryCount}}</span><span class="vpi-chevron-right icon" aria-hidden="true"></span></a>
<a class="nav-link" href="{{root}}archives/"><span class="vpi-archive icon-logo" aria-hidden="true"></span><span class="text">归档</span><span class="total">{{postCount}}</span><span class="vpi-chevron-right icon" aria-hidden="true"></span></a>
</nav>
