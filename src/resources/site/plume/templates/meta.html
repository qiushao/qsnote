{{#hasCategories}}<div class="category-list"><span class="icon vpi-folder" aria-hidden="true"></span>{{>categories}}</div>{{/hasCategories}}<div class="reading-time"><span class="icon vpi-books" aria-hidden="true"></span><span>约 {{wordCount}} 字</span><span>{{readingMinutes}} 分钟</span></div>{{#hasTags}}<div class="tag-list"><span class="icon vpi-tag" aria-hidden="true"></span>{{#tags}}<a class="tag vp-tag-color-{{color}}" href="{{url}}">{{name}}</a>{{/tags}}</div>{{/hasTags}}<div class="create-time"><span class="icon vpi-clock" aria-hidden="true"></span><time datetime="{{date}}">{{date|date:yyyy-MM-dd}}</time></div>
