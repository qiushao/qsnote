<article class="py-2 shiro-card">
  <header class="text-center mb-4">
    <h2 class="font-bold leading-snug text-text-heading text-[1.35rem] transition-colors hover:text-seal sm:text-[1.45rem] md:text-[1.6rem]"><a href="{{url}}">{{title}}</a></h2>
    {{>meta}}
  </header>
  <div class="prose-shiro"><p>{{excerpt}}</p></div>
  <div class="mt-6 text-center"><a href="{{url}}" class="focus-elegant btn-ink" aria-label="阅读全文：{{title}}">阅读全文</a></div>
</article>
