<article class="group flex min-w-0 items-baseline gap-6 shiro-archive-item">
  <time datetime="{{date|date:yyyy-MM-dd}}" class="w-24 shrink-0 text-right text-sm text-text-chrome oldstyle-nums">{{date|date:yyyy-MM-dd}}</time>
  <h3 class="min-w-0 text-base font-normal text-text-body transition-colors group-hover:text-seal"><a href="{{url}}" class="link-underline break-words">{{title}}</a></h3>
</article>
