<article class="content article article-archives article-type-list"><header class="article-header"><h1 itemprop="title">{{title}}</h1><p class="text-muted">共 {{listCount}} 篇文章</p></header><div class="article-body">{{#groups}}<section class="panel panel-default b-no"><div class="panel-heading" role="tab"><h3 class="panel-title"><a data-toggle="collapse" href="#collapse{{year}}" aria-expanded="true"><i class="icon icon-calendar-plus text-active"></i><i class="icon icon-calendar-minus text"></i> {{year}}</a></h3></div><div class="panel-collapse collapse in" id="collapse{{year}}"><div class="panel-body"><div class="collection">{{>collection}}</div></div></div></section>{{/groups}}</div></article>{{>pagination}}
