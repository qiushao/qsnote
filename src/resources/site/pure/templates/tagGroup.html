<h3 class="panel-title mb-1x"><a class="" href="{{url}}"># {{name}}</a> <small class="text-muted">(Total {{count}} articles)</small></h3><div class="row">{{#posts}}<div class="col-md-6"><article class="panel panel-default hover-shadow hover-grow" itemscope itemtype="http://schema.org/BlogPosting"><div class="panel-body"><div class="article-meta"><time>{{date|date:yyyy-MM-dd}}</time></div><h3 class="article-title" itemprop="name"><a class="article-link" href="{{url}}">{{title}}</a></h3></div><div class="panel-footer">{{#tags}}{{#label}}<a class="label label-default mb" href="{{url}}">{{name}}</a> {{/label}}{{/tags}}</div></article></div>{{/posts}}</div>
