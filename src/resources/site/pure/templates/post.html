<div class="content">
<article class="article article-type-post" id="post-{{route}}" itemscope="" itemtype="http://schema.org/BlogPosting">
<div class="article-header">
{{#inlinePost}}<h1 itemprop="name"><a class="article-title" href="{{url}}">{{title}}</a></h1>{{/inlinePost}}{{^inlinePost}}<h1 class="article-title" itemprop="name">{{title}}</h1>{{/inlinePost}}
<div class="article-meta">{{>meta}}</div>
</div>
<div class="article-entry marked-body" itemprop="articleBody">{{{body}}}</div>
<div class="article-footer">
<aside class="alert-note hidden-xs">
<p class="alert-title">本文链接</p>
<p><a href="{{permalink}}" rel="external" target="_blank" title="{{title}}">{{permalink}}</a></p>
<p class="alert-title">版权声明</p>
<p>本博客所有文章除特别声明外，均采用 <a href="http://creativecommons.org/licenses/by/4.0/deed.zh" rel="external" target="_blank">CC BY 4.0 CN</a> 许可协议。转载请注明出处！</p>
</aside>
</div>
</article>
<section id="comments">{{{comments}}}</section>
</div>
{{^inlinePost}}{{>navigation}}{{/inlinePost}}
