<div class="content">
<article class="article article-type-post" id="{{articleId}}" itemscope="" itemtype="http://schema.org/BlogPosting">
<div class="article-header">
<h1 class="article-title" itemprop="name">{{title}}</h1>
<div class="article-meta">{{meta}}</div>
</div>
<div class="article-entry marked-body" itemprop="articleBody">{{body}}</div>
<div class="article-footer">
<blockquote class="mt-2x">
<ul class="post-copyright list-unstyled">
<li class="post-copyright-link hidden-xs">
<strong>本文链接：</strong>
<a href="{{permalink}}" rel="external" target="_blank" title="{{title}}">{{permalink}}</a>
</li>
<li class="post-copyright-license">
<strong>版权声明： </strong> 本博客所有文章除特别声明外，均采用 <a href="http://creativecommons.org/licenses/by/4.0/deed.zh" rel="external" target="_blank">CC BY 4.0 CN协议</a> 许可协议。转载请注明出处！
    </li>
</ul>
</blockquote>
<div class="panel panel-default panel-badger">
<div class="panel-body">
<figure class="media">
<div class="media-left">
<a class="img-burn thumb-sm visible-lg" href="{{domain}}" target="_blank">
<img alt="" class="img-rounded w-full" src="{{root}}images/avatar.jpg"/>
</a>
</div>
<div class="media-body">
<h3 class="media-heading"><a href="{{domain}}" target="_blank"><span class="text-dark">{{author}}</span><small class="ml-1x"></small></a></h3>
<div>{{description}}</div>
</div>
</figure>
</div>
</div>
</div>
</article>
<section id="comments">{{comments}}</section>
</div>
