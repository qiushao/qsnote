<article class="article article-type-post" itemscope itemprop="blogPost"><div class="article-inner">
<header class="article-header"><h1 class="article-title" itemprop="name">{{title}}</h1>{{meta}}</header>
<div class="article-entry" itemprop="articleBody">{{body}}</div>
<div class="article-info article-info-index">{{tags}}{{categories}}<div class="clearfix"></div></div>
</div></article>
{{navigation}}
<section id="comments">{{comments}}</section>
