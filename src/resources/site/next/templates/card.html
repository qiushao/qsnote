<div class="post-block"><article class="post-content" itemscope itemtype="http://schema.org/Article">
<header class="post-header"><h2 class="post-title" itemprop="name headline"><a class="post-title-link" href="{{url}}" itemprop="url">{{title}}</a></h2><div class="post-meta-container"><div class="post-meta">{{meta}}</div></div></header>
<div class="post-body" itemprop="articleBody"><p>{{excerpt}}</p><div class="post-button"><a class="btn" href="{{url}}">阅读全文 &raquo;</a></div></div>
<footer class="post-footer"><div class="post-eof"></div></footer>
</article></div>
