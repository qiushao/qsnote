<div class="post-block"><article class="post-content" itemscope itemtype="http://schema.org/Article">
<header class="post-header"><h1 class="post-title" itemprop="name headline">{{title}}</h1><div class="post-meta-container"><div class="post-meta">{{meta}}</div></div></header>
<div class="post-body" itemprop="articleBody">{{body}}</div>
<footer class="post-footer"><div class="post-tags">{{tags}}</div>{{navigation}}</footer>
</article></div>
<section id="comments" class="comments">{{comments}}</section>
