<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{description}}">
<title>{{headTitle}}</title>
<link rel="stylesheet" href="{{root}}css/main.css">
<link rel="stylesheet" href="{{root}}lib/fontawesome/css/all.min.css">
<script class="next-config" data-name="main" type="application/json">{{config}}</script>
<script class="next-config" data-name="page" type="application/json">{{pageConfig}}</script>
<script src="{{root}}js/config.js"></script>
<script defer src="{{root}}js/utils.js"></script>
<script defer src="{{root}}js/sidebar.js"></script>
<script defer src="{{root}}js/next-boot.js"></script>
<script defer src="{{root}}js/search.js"></script>
<script defer src="{{root}}js/local-search.js"></script>
<noscript><link rel="stylesheet" href="{{root}}css/noscript.css"></noscript>
</head>
<body itemscope itemtype="http://schema.org/WebPage">
<div class="headband"></div>
<main class="main">
<div class="column">
<header class="header" itemscope itemtype="http://schema.org/WPHeader">
<div class="site-brand-container">
<div class="site-nav-search popup-trigger" aria-label="搜索" role="button"><i class="fa fa-search fa-fw fa-lg"></i></div>
<div class="site-meta"><a href="{{root}}" class="brand" rel="start"><i class="logo-line"></i><p class="site-title">{{siteTitle}}</p><i class="logo-line"></i></a><p class="site-subtitle" itemprop="description">{{description}}</p></div>
<div class="site-nav-toggle" aria-label="切换导航栏" role="button"><i class="fa fa-ellipsis fa-fw fa-lg"></i></div>
</div>
<nav class="site-nav"><ul class="main-menu menu">
<li class="menu-item"><a href="{{root}}" rel="section"><i class="fa fa-home fa-fw"></i>首页</a></li>
<li class="menu-item"><a href="{{root}}categories/" rel="section"><i class="fa fa-th fa-fw"></i>分类</a></li>
<li class="menu-item"><a href="{{root}}tags/" rel="section"><i class="fa fa-tags fa-fw"></i>标签</a></li>
<li class="menu-item"><a href="{{root}}archives/" rel="section"><i class="fa fa-archive fa-fw"></i>归档</a></li>
<li class="menu-item"><a href="{{root}}links/" rel="section"><i class="fa fa-link fa-fw"></i>友链</a></li>
<li class="menu-item"><a href="{{root}}about/" rel="section"><i class="fa fa-user fa-fw"></i>关于</a></li>
<li class="menu-item menu-item-search"><a role="button" class="popup-trigger"><i class="fa fa-search fa-fw"></i>搜索</a></li>
</ul></nav>
<template id="search-popup-template"><div class="search-pop-overlay"><div class="popup search-popup">
<div class="search-header"><span class="search-icon"><i class="fa fa-search"></i></span><div class="search-input-container"><input autocomplete="off" autocapitalize="off" maxlength="80" placeholder="搜索..." aria-label="搜索" spellcheck="false" type="search" class="search-input"></div><span class="popup-btn-close" role="button" aria-label="关闭搜索"><i class="fa fa-times-circle"></i></span></div>
<div class="search-result-container"><div class="search-result-icon"><i class="fa fa-spinner fa-pulse fa-5x"></i></div></div>
</div></div></template>
</header>
<aside class="sidebar"><div class="sidebar-inner {{sidebarClass}}">
<ul class="sidebar-nav"><li class="sidebar-nav-toc">文章目录</li><li class="sidebar-nav-overview">站点概览</li></ul>
<div class="sidebar-panel-container">
<div class="post-toc-wrap sidebar-panel">{{toc}}</div>
<div class="site-overview-wrap sidebar-panel"><div class="site-author animated" itemprop="author" itemscope itemtype="http://schema.org/Person"><img class="site-author-image" itemprop="image" alt="{{author}}" src="{{root}}images/avatar.gif"><p class="site-author-name" itemprop="name">{{author}}</p><div class="site-description" itemprop="description">{{description}}</div></div>
<div class="site-state-wrap animated"><nav class="site-state">
<div class="site-state-item site-state-posts"><a href="{{root}}archives/"><span class="site-state-item-count">{{postCount}}</span><span class="site-state-item-name">日志</span></a></div>
<div class="site-state-item site-state-categories"><a href="{{root}}categories/"><span class="site-state-item-count">{{categoryCount}}</span><span class="site-state-item-name">分类</span></a></div>
<div class="site-state-item site-state-tags"><a href="{{root}}tags/"><span class="site-state-item-count">{{tagCount}}</span><span class="site-state-item-name">标签</span></a></div>
</nav></div></div></div></div></aside>
</div>
<div class="main-inner {{layout}}">{{content}}</div>
</main>
<footer class="footer"><div class="footer-inner"><div>{{footer}}</div><div class="powered-by">主题 — <a href="https://github.com/next-theme/hexo-theme-next" rel="noopener" target="_blank">NexT.Muse</a></div></div></footer>
<div class="toggle sidebar-toggle" role="button" aria-label="切换侧栏"><span class="toggle-line"></span><span class="toggle-line"></span><span class="toggle-line"></span></div>
<div class="back-to-top" role="button" aria-label="返回顶部"><i class="fa fa-arrow-up fa-lg"></i><span>0%</span></div>
</body>
</html>
